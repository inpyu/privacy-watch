content: |
  조문 및 해설의 분석용 요약 (원문 전문이 아님).
  안내 사항: 개인정보 보호법 제29조 및 시행령 제16조제2항, 제30조, 제30조의2를 설명하는 2026년 11월 발간 안내서. 2026년 7월 기준 개정을 반영한다.
  제3조 안전조치 적용 원칙: 개인정보 유형, 규모, 정보주체 영향과 처리 환경을 고려하여 위험에 맞는 안전성 확보조치를 적용한다.
  제4조 내부 관리계획: 관리계획 수립 시행, 개인정보취급자 교육 및 연 1회 이상 이행 점검을 설명하며 일부 소규모 처리자에게 예외가 존재한다.
  제5조 접근 권한 관리: 개인정보처리시스템 권한은 최소화하고 변경·말소 이력을 적어도 3년 보관하도록 규정한다. 인증 실패 시 접근 제한 등의 보호조치를 적용한다.
  제6조 접근통제: 비인가 접근을 차단하고 외부접속의 안전한 인증수단, 미사용 세션 종료, 업무용 모바일 보호 등을 규정한다.
  제6조의2 인터넷망 차단: 일정 규모(일평균 이용자 100만명 이상) 개인정보처리자에서 권한 설정 또는 개인정보 다운로드·파기 권한이 있는 취급자의 컴퓨터 등에 인터넷망 차단을 규정한다. 다운로드·파기 업무의 일부 위험분석 기반 예외 및 민감정보 관련 예외 제한을 명시한다.
  제7조 개인정보 암호화: 비밀번호의 일방향 암호화 저장, 인증정보·특정 식별정보의 암호화, 개인정보 통신구간 보호와 일정 규모 사업자의 암호키 관리 절차를 규정한다.
  제8조 접속기록: 일반적 1년 이상 보관, 5만명 이상 또는 민감정보·고유식별정보 등의 특정 시스템은 2년 이상 보관한다. 접속기록 점검과 무결성·안전 보관을 요구한다.
  제9조 악성프로그램 방지: 백신·보안프로그램 갱신 및 경보 대응을 설명한다.
  제11조 재난 대비: 규모 기준에 해당하는 사업자의 위기대응 및 백업·복구 계획을 요구한다.
  제12조 출력·복사 안전조치: 출력 목적·항목 최소화, 복사물 안전한 보관을 규정한다.
  제13조 개인정보 파기: 완전파괴, 소자, 복원 불가능한 초기화·덮어쓰기 등으로 파기하고, 부분 파기와 기술적 곤란 예외를 구분한다.
  제14조~제18조: 지정된 공공시스템운영기관에 대한 추가 안전조치. 일반 민간기업에 자동 적용하지 않는다.
  부칙: 2026년 7월 1일 발령·시행. 제15조제5호와 제18조는 2027년 1월 1일 시행.
  이 파일은 공개 규정의 적용대상·경과규정·위임고시 및 예외를 자동으로 확정하지 않는다. 최종 분석 시 공식 원문 확인 필요.
